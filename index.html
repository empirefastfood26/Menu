<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>مینو | Menu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      color: #ffffff;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }
    .menu-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .menu-page {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }
    .divider {
      width: 85%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.35), transparent);
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <main class="menu-container">
    <img 
      src="menu1.jpg" 
      alt="مینو - بەشی یەکەم" 
      class="menu-page"
      data-base="menu1"
      onerror="tryNextExt(this)"
    >
    <div class="divider"></div>
    <img 
      src="menu2.jpg" 
      alt="مینو - بەشی دووەم" 
      class="menu-page"
      data-base="menu2"
      onerror="tryNextExt(this)"
    >
  </main>

  <script>
    const extensions = ['JPG', 'png', 'PNG', 'jpeg', 'JPEG', 'jpg.jpg', 'png.png'];
    function tryNextExt(img) {
      let step = parseInt(img.getAttribute('data-step') || '0', 10);
      if (step < extensions.length) {
        const base = img.getAttribute('data-base');
        img.setAttribute('data-step', step + 1);
        img.src = base + '.' + extensions[step];
      }
    }
  </script>
</body>
</html>
